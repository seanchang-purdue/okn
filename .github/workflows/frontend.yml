name: frontend

on:
  push:
    branches: [main, seanchang/shadcn]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AGENT_ENABLED: "false"
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:1
      NEXT_PUBLIC_CHATBOT_URL: ws://127.0.0.1:1/api/v1/ws
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
